<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
  body {
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: Arial, sans-serif;
  }

  .bot-image {
    width: 250px;
    max-width: 90%;
    border-radius: 15px;
    margin-bottom: 15px;
  }

  .play-btn {
    background-color: #1a73e8;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: Arial, sans-serif;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  .play-btn:hover {
    background-color: #1557b0;
  }
  
.learning-container {
  margin-top: 30px;
  margin-bottom: 20px;
  text-align: center;
}


.learning-button {
  position: absolute;
  top: 400px;
  left: 50%;
  transform: translateX(-50%);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 32px;

  background: linear-gradient(135deg, #4776e6, #3155c6);
  color: white;
  font-family: Arial, sans-serif;
  font-size: 20px;
  font-weight: 700;
  text-decoration: none;
  border-radius: 14px;
  box-shadow: 0 6px 14px rgba(49, 85, 198, 0.25);
  cursor: pointer;
}

.learning-button:hover {
  background: #1d4ed8;
}

.button-arrow {
  font-size: 24px;
}

</style>
</head>

<body>

<img class="bot-image" src="bot.jpg" alt="Derivatives Bot">

<audio id="myAudio">
  <source src="Voice.mp3" type="audio/mpeg">
  Your browser does not support audio.
</audio>

<button class="play-btn" id="playButton">
  <span id="icon">▶</span>
  <span id="text">Play Audio</span>
</button>

<div class="learning-container">
 
<a
  href="https://sites.google.com/view/chatbot-assignment-2/home"
  class="learning-button"
  target="_blank"
  rel="noopener noreferrer"
>
  Start Learning <span class="button-arrow">→</span>
</a>
  
</div>
  
<script>
  const audio = document.getElementById("myAudio");
  const button = document.getElementById("playButton");
  const icon = document.getElementById("icon");
  const text = document.getElementById("text");

  button.addEventListener("click", function() {

    if (audio.paused) {

      audio.play()
        .then(function() {
          icon.textContent = "⏸";
          text.textContent = "Pause";
        })
        .catch(function(error) {
          console.error("Audio error:", error);
          text.textContent = "Audio Error";
        });

    } else {

      audio.pause();
      icon.textContent = "▶";
      text.textContent = "Play Audio";

    }

  });

  audio.addEventListener("ended", function() {
    icon.textContent = "▶";
    text.textContent = "Play Audio";
  });
</script>

</body>
</html>
