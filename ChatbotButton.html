
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Derivatives Learning</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #24332e;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      text-align: center;
    }

    .heading {
      margin-bottom: 8px;
      font-size: 30px;
      font-weight: bold;
      color: #245c49;
    }

    .intro {
      max-width: 600px;
      margin: 0 auto 25px;
      line-height: 1.6;
      color: #5b6862;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .topic-button {
      min-height: 75px;
      padding: 16px 12px;
      border: 1px solid #d7e0db;
      border-radius: 12px;
      background: white;
      color: #245c49;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .topic-button.active {
      background: #245c49;
      color: white;
      border-color: #245c49;
    }

    .topic-button.active:hover {
      background: #194534;
    }

    .topic-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #chat-section {
      display: none;
      margin-top: 28px;
    }

    .chat-heading {
      color: #245c49;
      font-size: 22px;
    }

    .back-button {
      margin-bottom: 16px;
      padding: 10px 18px;
      border: 1px solid #245c49;
      border-radius: 8px;
      background: white;
      color: #245c49;
      font-size: 14px;
      cursor: pointer;
    }

    .back-button:hover {
      background: #e7f0eb;
    }

    .chat-frame {
      display: block;
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 12px;
      background: white;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 10px;
      }

      .heading {
        font-size: 25px;
      }

      .topic-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .topic-button {
        min-height: 60px;
      }

      .chat-frame {
        height: 600px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div id="menu-section">
      <div class="heading">Welcome</div>

      <p class="intro">
        Your beginner-friendly guide to financial derivatives.
        Select a topic below to start learning.
      </p>

      <div class="topic-grid">
        <button class="topic-button" disabled>
          Futures
        </button>

        <button class="topic-button" disabled>
          Currency Swaps
        </button>

        <button class="topic-button" disabled>
          Call Options
        </button>

        <button class="topic-button" disabled>
          Interest Rate Swaps
        </button>

        <button class="topic-button" disabled>
          Forwards
        </button>

        <button
          class="topic-button active"
          type="button"
          onclick="showChatbot()"
        >
          Put Options
        </button>
      </div>
    </div>

    <section id="chat-section">
      <h2 class="chat-heading">Put Options Chatbot</h2>

      <button
        class="back-button"
        type="button"
        onclick="hideChatbot()"
      >
        Back to Topics
      </button>

      <iframe
        class="chat-frame"
        title="Put Options Chatbot"
        src="https://interfaces.zapier.com/embed/chatbot/cmv0c7s9s001g8wwwf4hj0ewj"
        allow="clipboard-write *"
      ></iframe>
    </section>

  </main>

  <script>
    function showChatbot() {
      document.getElementById("menu-section").style.display = "none";
      document.getElementById("chat-section").style.display = "block";

      document.getElementById("chat-section").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function hideChatbot() {
      document.getElementById("chat-section").style.display = "none";
      document.getElementById("menu-section").style.display = "block";

      document.getElementById("menu-section").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  </script>
</body>
</html>
