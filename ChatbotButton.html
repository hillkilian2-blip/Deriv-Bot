<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Derivatives Learning</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px 16px;
    font-family: Arial, sans-serif;
    background: #d9f1fe;
    color: #101D3A;
  }

  .container {
    max-width: 850px;
    margin: 0 auto;
    text-align: center;
  }

  .heading {
    margin-bottom: 20px;
    font-size: 34px;
    font-weight: bold;
    color: #101D3A;
  }

  .topic-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .topic-button {
    min-height: 50px;
    padding: 10px 12px;
    border: 1px solid #101D3A;
    border-radius: 10px;
    background: #FFFFFF;
    color: #101D3A;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }

  .topic-button.active {
    background: #FFFBD3;
    color: #101D3A;
    border-color: #101D3A;
  }

  .topic-button.active:hover {
    background: #F5EFB8;
    transform: translateY(-2px);
  }

  .topic-button:disabled {
    opacity: 0.85;
    cursor: not-allowed;
  }

  #chat-section {
    display: none;
    margin-top: 20px;
    text-align: left;
  }

  .chat-heading {
    text-align: center;
    color: #101D3A;
    font-size: 22px;
  }

  .back-button {
    display: block;
    margin: 0 auto 16px;
    padding: 10px 18px;
    border: 1px solid #101D3A;
    border-radius: 8px;
    background: #FFFBD3;
    color: #101D3A;
    font-size: 14px;
    cursor: pointer;
  }

  .back-button:hover {
    background: #F5EFB8;
  }

  /* Custom chatbot */

  .chat-app {
    --chat-bg: #e8fdff;
    --chat-ink: #11213a;
    --chat-muted: #5b6676;
    --chat-accent: #00aedb;
    --chat-card: #ffffff;

    width: 100%;
    max-width: 960px;
    height: 620px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    background: var(--chat-bg);
    color: var(--chat-ink);
    font-family: "Inter", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    border-radius: 12px;
    overflow: hidden;
  }

  .chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 0 20px;
  }

  .chat-msg {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .chat-msg.chat-user {
    justify-content: flex-end;
  }

  .chat-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
    flex: none;
    display: grid;
    place-items: center;
  }

  .chat-avatar svg {
    width: 30px;
    height: 30px;
  }

  .chat-body {
    flex: 1;
    max-width: 740px;
    min-width: 0;
  }

  .chat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 38px;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
  }

  .chat-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--chat-muted);
    font-size: 12px;
    font-weight: 400;
  }

  .chat-tools button {
    all: unset;
    cursor: pointer;
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    color: var(--chat-muted);
  }

  .chat-tools button:hover,
  .chat-tools button.on {
    color: var(--chat-accent);
  }

  .chat-tools svg {
    width: 15px;
    height: 15px;
  }

  .chat-bubble {
    background: var(--chat-card);
    border-radius: 8px;
    padding: 14px 18px;
    box-shadow: 0 2px 8px rgba(0, 174, 219, 0.12);
    margin-top: 2px;
    overflow-wrap: anywhere;
  }

  .chat-bubble p {
    margin: 0 0 10px;
  }

  .chat-bubble p:last-child {
    margin-bottom: 0;
  }

  .chat-bubble strong {
    font-weight: 600;
  }

  .chat-bubble ul {
    margin: 0 0 10px;
    padding-left: 22px;
  }

  .chat-user-bubble {
    background: var(--chat-accent);
    color: #fff;
    font-weight: 500;
    padding: 12px 18px;
    border-radius: 8px;
    max-width: 80%;
    margin-top: 36px;
    overflow-wrap: anywhere;
  }

  .chat-user.first .chat-user-bubble {
    margin-top: 0;
  }

  .chat-typing {
    display: inline-flex;
    gap: 5px;
    padding: 6px 0;
  }

  .chat-typing i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9aa6b5;
    animation: chat-blink 1.1s infinite ease-in-out;
  }

  .chat-typing i:nth-child(2) {
    animation-delay: .15s;
  }

  .chat-typing i:nth-child(3) {
    animation-delay: .3s;
  }

  @keyframes chat-blink {
    0%, 80%, 100% { opacity: .3; }
    40% { opacity: 1; }
  }

  .chat-composer {
    flex: none;
    padding: 0 0 4px;
  }

  .chat-field {
    display: flex;
    align-items: center;
    background: #fff;
    border: 2px solid var(--chat-accent);
    border-radius: 10px;
    padding: 4px;
  }

  .chat-field input {
    flex: 1;
    min-width: 0;
    border: 1px solid #d5dde5;
    outline: 0;
    background: #fff;
    font: inherit;
    font-size: 16px;
    color: var(--chat-ink);
    padding: 12px;
    border-radius: 6px;
    margin: 4px;
  }

  .chat-field input::placeholder {
    color: #5f6b7a;
  }

  .chat-field button {
    all: unset;
    cursor: pointer;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    margin-right: 6px;
    color: #65758a;
    flex: none;
  }

  .chat-field button:hover,
  .chat-field button:focus-visible {
    color: var(--chat-accent);
  }

  .chat-field button svg {
    width: 24px;
    height: 24px;
  }

  .chat-hint {
    padding: 7px 4px 0;
    color: var(--chat-muted);
    font-size: 12px;
    text-align: center;
  }

  .chat-spacer {
    height: 12px;
  }

  @media (max-width: 480px) {
    body {
      padding: 18px 10px;
    }

    .heading {
      font-size: 27px;
    }

    .topic-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .topic-button {
      min-height: 45px;
    }

    .chat-app {
      height: 600px;
      padding: 0 10px;
    }

    .chat-bubble {
      padding: 12px;
    }

    .chat-tools {
      gap: 5px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .chat-typing i {
      animation: none;
      opacity: .6;
    }
  }
</style>
</head>

<body>
<main class="container">

  <div id="menu-section">
    <div class="heading">Choose a Derivative to start learning.</div>

    <div class="topic-grid">
      <button class="topic-button" disabled>Futures</button>
      <button class="topic-button" disabled>Currency Swaps</button>
      <button class="topic-button" disabled>Call Options</button>
      <button class="topic-button" disabled>Interest Rate Swaps</button>
      <button class="topic-button" disabled>Forwards</button>

      <button
        class="topic-button active"
        type="button"
        onclick="showChatbot()"
      >
        Put Options
      </button>
    </div>
  </div>

  <section id="chat-section">
    <h2 class="chat-heading">Put Options Chatbot</h2>

    <button
      class="back-button"
      type="button"
      onclick="hideChatbot()"
    >
      Back to Topics
    </button>

    <div class="chat-app">
      <div class="chat-messages" id="chat-messages" aria-live="polite"></div>

      <div class="chat-composer">
        <form class="chat-field" id="chat-form" autocomplete="off">
          <input
            id="chat-input"
            type="text"
            placeholder="Ask me more about Put Options"
            aria-label="Your question"
          >

          <button type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.5 3.2 22 12 2.5 20.8l.1-6.9L15 12 2.6 10.1z"/>
            </svg>
          </button>
        </form>
        <div class="chat-spacer"></div>
      </div>
    </div>
  </section>

</main>

<script>

const BOT_NAME = "Chatbot";
const GREETING = "Want to know about put options?";
const FALLBACK = "Sorry, I don't have an answer for that yet. Try asking something about put options.";

const QA = [
  {
    keywords: [
      "What exactly is a put option?",
      "what is a put option",
      "what are put options",
      "define put option"
    ],
    answer: `<p>A <strong>put option</strong> is a contract that gives the buyer the right, but not the obligation, to sell an asset at the strike price by the expiration date.</p>`
  },
  {
    keywords: [
      "And how does a put option work?"
    ],
    answer: `<p>A put option is like insurance for a stock you own: you pay a fee for the right to sell it at a set price.</p>
             <ul>
               <li>If the stock drops below that price, you use the put and sell at the higher price and you're protected.</li>
               <li>If the stock rises, you skip the put and sell at the market price and you only lose the fee.</li>
             </ul>`
  },
  {
    keywords: [
      "You mentioned strike price before. What is that?",
      "what is the strike price",
      "strike price",
      "define strike price"
    ],
    answer: `<p>The <strong>strike price</strong> is the agreed price at which the buyer can sell the asset using a put option.</p>`
  },
  {
    keywords: [
      "How about the expiration date?",
      "what is the expiration date",
      "expiration date",
      "when does a put option expire"
    ],
    answer: `<p>The <strong>expiration date</strong> is the last day the option is valid. After this date, the buyer can no longer use the option to sell the asset at the strike price.</p>`
  },
  {
    keywords: [
      "And who is considered the buyer?"
    ],
    answer: `<p>The <strong>buyer</strong> is the person who pays the premium to get the right to sell the asset at the strike price.</p>`
  },
  {
    keywords: [
      "Please define what the premium is.",
      "what is the premium",
      "define premium",
      "option premium"
    ],
    answer: `<p>The <strong>premium</strong> is the price that the buyer pays the seller to purchase the option.</p>`
  },
  {
    keywords: [
      "So who is the seller?"
    ],
    answer: `<p>The <strong>seller</strong> is the person who receives the premium and agrees to buy the asset at the strike price if the buyer exercises the option.</p>`
  },
  {
    keywords: [
      "So how do I know whether a put option is actually worth using? Is there a way to describe that?",
      "in the money",
      "at the money",
      "out of the money",
      "itm atm otm"
    ],
    answer: `<ul>
               <li><strong>In the money:</strong> the stock price is <em>below</em> the strike price. Selling at the strike beats the market, so the put is worth using.</li>
               <li><strong>At the money:</strong> the stock price is <em>equal</em> to the strike price.</li>
               <li><strong>Out of the money:</strong> the stock price is <em>above</em> the strike price. You could just sell at the market, so the put isn't worth using.</li>
             </ul>`
  },
  {
    keywords: [
      "What does it mean to 'exercise' a put option?",
      "what does exercise mean",
      "exercise a put option",
      "exercising an option"
    ],
    answer: `<p>To <strong>exercise</strong> an option means to use your right and sell the asset at the strike price. You normally only do this when the put is in the money. If it isn't, you simply let it expire.</p>`
  },
  {
    keywords: [
      "What's the difference between intrinsic value and time value?",
      "intrinsic value",
      "time value"
    ],
    answer: `<ul>
               <li><strong>Intrinsic value</strong> is how far in the money the option is: the strike price minus the stock price. If it's out of the money, this part is zero.</li>
               <li><strong>Time value</strong> is the extra amount buyers pay for the chance that the price moves in their favor before expiration. It shrinks as the expiration date gets closer.</li>
             </ul>`
  },
  {
    keywords: [
      "What affects the price of a put option?",
      "what affects the premium",
      "what determines the price of a put option",
      "put option pricing"
    ],
    answer: `<p>Four main things move the price of a put option:</p>
             <ul>
               <li><strong>Stock price:</strong> the lower the stock price, the more valuable the put.</li>
               <li><strong>Strike price:</strong> a higher strike price makes the put more valuable.</li>
               <li><strong>Time left:</strong> more time until expiration means a higher price, because there is more chance for the stock to fall.</li>
               <li><strong>Volatility:</strong> the more a stock jumps around, the more the put costs.</li>
             </ul>`

  {
    keywords: [
      "So I'm guessing that there are benefits to put options, what are they?"
    ],
    answer: `<p>Absolutely! Put options protect against falling prices, limit potential losses, and allow investors to profit from price decreases.</p>`

  {
    keywords: [
      "And why are they important in financial management?"
    ],
    answer: `<p>Put options are primarily used by financial managers and investors for <strong>hedging</strong>.</p>`
  },
  {
    keywords: [
      "I don't understand what hedging means. Please explain."
    ],
    answer: `<p><strong>Hedging</strong> is a way to reduce the risk of losing money by using financial contracts to protect against unfavorable changes in market prices.</p>`
  },
  {
    keywords: [
      "So how does someone actually hedge with a put? What is a protective put?",
      "protective put",
      "what is a protective put"
    ],
    answer: `<p>A <strong>protective put</strong> means owning a stock and buying a put option on that same stock. It works like insurance on something you already own.</p>
             <p>For example, if you own shares worth $50 and buy a put with a $45 strike price, the most you can lose per share on the price drop is $5, no matter how far the stock falls. You also pay the premium for that protection.</p>`
  },
  {
    keywords: [
      "Can someone use puts without owning the stock, just to make money?",
      "speculation",
      "speculate with put options",
      "buy a put for speculation"

    answer: `<p>Yes. This is called <strong>speculation</strong>. An investor who thinks a stock's price will fall can buy a put without owning the stock.</p>
             <ul>
               <li>If the price falls far enough below the strike price, the put gains value and the investor profits.</li>
               <li>If the price doesn't fall, the investor loses the premium.</li>
             </ul>
             <p>It is riskier than hedging because there is no stock to protect.</p>`
  },
  {
    keywords: [
      "How is that different from short selling?",
      "put option vs short selling",
      "short selling",
      "what is short selling"
    ],
    answer: `<p>Both can profit from a falling price, but the risk is very different.</p>
             <ul>
               <li><strong>Short selling:</strong> you borrow shares, sell them, and hope to buy them back cheaper. If the price rises instead, your losses can keep growing.</li>
               <li><strong>Buying a put:</strong> the most you can lose is the premium you paid.</li>
             </ul>`
  },
  {
    keywords: [
      "So what are the downsides of put options?"
    ],
    answer: `<p>The main limitations and risks are that put options cost a premium, can expire worthless, and only provide protection until their expiration date.</p>`
  },
  {
    keywords: [
      "So if I were to buy a put option. What risks could I face?"
    ],
    answer: `<p>As the buyer, you can lose the premium if the option expires worthless or loses value before expiration.</p>`
  },
  {
    keywords: [
      "And what risks does the seller face?"
    ],
    answer: `<p>The seller keeps the premium but may have to buy the asset at the strike price, even if its market price drops sharply.</p>`
  },
  {
    keywords: [
      "How do I figure out whether I made money on a put?",
      "breakeven",
      "break even price",
      "how to calculate profit on a put"
    ],
    answer: `<p>Start with the <strong>breakeven price</strong>: the strike price minus the premium per share. The stock has to fall below this price for the buyer to make a profit.</p>
             <p>For example, with a $45 strike and a $2 premium per share, the breakeven is $43. If the stock falls to $40, the profit is $3 per share ($45 - $40 - $2), or $300 for 100 shares. If the stock stays above $45, the buyer loses only the $2 per share premium ($200).</p>`

    answer: `<p>Yes. Exchange-traded options are standardized and backed by a clearing house, which guarantees the trade so neither side has to worry the other won't pay.</p>`

  {

      "So if I wanted to buy put options, what can I do to mitigate the risks?"

    answer: `<p>As a buyer, you should only spend money you can afford to lose, choose an expiration date that gives you enough time, and have a plan for when to sell.</p>`

  {

    answer: `<p>Absolutely! Say a person buys a put option on 100 shares worth $50 each, with a strike price of $45 and a $200 premium. If the share price falls to $30, they can still sell the shares for $45 each, protecting themselves from losses. If the price rises, they can let the option expire, losing only the $200 premium.</p>`

  {
    keywords: [
      "That helped with the buyer. Can you show me an example from the seller's side?",
      "seller example",
      "example for the seller"
    ],
    answer: `<p>Sure! Using the same put option, the seller receives the $200 premium.</p>
             <ul>
               <li>If the stock stays above $45, say at $50, the option expires worthless and the seller keeps the $200.</li>
               <li>If the stock falls to $30, the seller must buy 100 shares at $45 ($4,500) that are only worth $3,000. That is a $1,500 loss, reduced to $1,300 by the $200 premium.</li>
             </ul>`

    keywords: [

      "put options in belize",
      "trade options in belize"

function timeNow() {
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, "0");
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return `${h}:${m}${ap}`;
}

function scrollChat() {
  $messages.scrollTop = $messages.scrollHeight;
}

function addBot(html, withTools = true) {
  const el = document.createElement("div");
  el.className = "chat-msg chat-bot";

  el.innerHTML = `
    <div class="chat-avatar">${ROBOT}</div>
    <div class="chat-body">
      <div class="chat-head">
        <span>${BOT_NAME}</span>
        ${withTools ? `
          <span class="chat-tools">
            <button type="button" data-act="up" aria-label="Good answer">${ICON_UP}</button>
            <button type="button" data-act="down" aria-label="Bad answer">${ICON_DOWN}</button>
            <button type="button" data-act="copy" aria-label="Copy answer">${ICON_COPY}</button>
            <span>${timeNow()}</span>
          </span>
        ` : ""}
      </div>
      <div class="chat-bubble">${html}</div>
    </div>
  `;

  $messages.appendChild(el);
  scrollChat();
  return el;
}

function addUser(text) {
  const el = document.createElement("div");
  el.className = "chat-msg chat-user";

  if (!$messages.querySelector(".chat-user")) {
    el.classList.add("first");
  }

  const bubble = document.createElement("div");
  bubble.className = "chat-user-bubble";
  bubble.textContent = "";

  el.appendChild(bubble);
  $messages.appendChild(el);
  scrollChat();

  return bubble;
}

// Reveal the user's question one character at a time.
function typeQuestion(bubble, text, speed = 25) {
  return new Promise((resolve) => {
    let position = 0;

    const typingInterval = setInterval(() => {
      bubble.textContent += text.charAt(position);
      position++;
      scrollChat();

      if (position >= text.length) {
        clearInterval(typingInterval);
        resolve();
      }
    }, speed);
  });
}

function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function findAnswer(text) {
  const question = " " + normalize(text) + " ";
  let bestAnswer = null;
  let bestLength = 0;

  for (const item of QA) {
    for (const keyword of item.keywords) {
      const normalizedKeyword = " " + normalize(keyword) + " ";

      if (
        question.includes(normalizedKeyword) &&
        normalizedKeyword.length > bestLength
      ) {
        bestAnswer = item;
        bestLength = normalizedKeyword.length;
      }
    }
  }

  return bestAnswer
    ? bestAnswer.answer
    : `<p>${FALLBACK}</p>`;
}

// Holds the answer for a prepared question until the right arrow is pressed again.
let pendingAnswer = null;

// Show the chatbot's loading dots for one second, then reveal the answer.
function revealAnswer(html) {
  isReplyPending = true;

  const typing = addBot(
    `<span class="chat-typing"><i></i><i></i><i></i></span>`,
    false
  );

  setTimeout(() => {
    typing.remove();
    addBot(html);
    isReplyPending = false;
  }, 1000);
}

// Show a pending answer immediately (used if someone types their own question first).
function flushPendingAnswer() {
  if (pendingAnswer === null) return;
  addBot(pendingAnswer);
  pendingAnswer = null;
}

// Typed questions: the question types out, then the answer appears after the loading dots.
async function ask(text) {
  if (isReplyPending) return;
  isReplyPending = true;

  flushPendingAnswer();

  const questionBubble = addUser(text);

  // First, animate the question as if it is being typed.
  await typeQuestion(questionBubble, text);

  // Then show the chatbot's thinking animation for one second.
  revealAnswer(findAnswer(text));
}

// Prepared questions: the question types out and then waits for another right arrow press.
async function askPrepared(text) {
  if (isReplyPending) return;
  isReplyPending = true;

  const questionBubble = addUser(text);
  await typeQuestion(questionBubble, text);

  // Keep the answer ready; the next right arrow press reveals it.
  pendingAnswer = findAnswer(text);
  isReplyPending = false;
}

// Right arrow flow: question, then answer, then next question, and so on.
function showNextQuestion() {
  if (isReplyPending) return;

  // If a question is waiting for its answer, show the answer now.
  if (pendingAnswer !== null) {
    const answer = pendingAnswer;
    pendingAnswer = null;
    revealAnswer(answer);
    return;
  }

  if (nextQuestionIndex >= QA.length) return;

  // The first keyword in each entry is the exact question to display.
  const question = QA[nextQuestionIndex].keywords[0];
  nextQuestionIndex++;
  askPrepared(question);
}

// Use the right arrow to advance during the presentation.
// If the input contains text, the arrow key works normally so you can edit it.
document.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowRight") return;

  const chatIsVisible =
    document.getElementById("chat-section").style.display !== "none";

  if (!chatIsVisible || event.altKey || event.ctrlKey || event.metaKey) return;

  const typingInInput =
    event.target === $input && $input.value.length > 0;

  if (typingInInput) return;

  event.preventDefault();
  showNextQuestion();
});

$form.addEventListener("submit", (event) => {
  event.preventDefault();

  const text = $input.value.trim();
  if (!text) return;

  $input.value = "";
  ask(text);
});

$messages.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-act]");
  if (!button) return;

  const action = button.dataset.act;

  if (action === "copy") {
    const answer = button
      .closest(".chat-body")
      .querySelector(".chat-bubble").innerText;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(answer).catch(() => {});
    }

    button.classList.add("on");
    setTimeout(() => button.classList.remove("on"), 1200);
  } else {
    const tools = button.closest(".chat-tools");

    tools.querySelectorAll('[data-act="up"], [data-act="down"]')
      .forEach((item) => item.classList.remove("on"));

    button.classList.add("on");
  }
});

function showChatbot() {
  document.getElementById("menu-section").style.display = "none";
  document.getElementById("chat-section").style.display = "block";

  document.getElementById("chat-section").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  $input.focus();
}

function hideChatbot() {
  document.getElementById("chat-section").style.display = "none";
  document.getElementById("menu-section").style.display = "block";

  document.getElementById("menu-section").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

addBot(`<p>${GREETING}</p>`, false);
</script>
</body>
</html>
