<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Derivatives Learning</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px 16px;
    font-family: Arial, sans-serif;
    background: #d9f1fe;
    color: #101D3A;
  }

  .container {
    max-width: 850px;
    margin: 0 auto;
    text-align: center;
  }

  .heading {
    margin-bottom: 20px;
    font-size: 34px;
    font-weight: bold;
    color: #101D3A;
  }

  .topic-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    max-width: 540px;
    margin: 0 auto;
  }

  .topic-button {
    display: block;
    width: 100%;
    text-align: center;
    min-height: 58px;
    padding: 10px 16px;
    border: 1px solid #101D3A;
    border-radius: 10px;
    background: #FFFFFF;
    color: #101D3A;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }

  .topic-button.active {
    background: #FFFBD3;
    color: #101D3A;
    border-color: #101D3A;
  }

  .topic-button.active:hover {
    background: #F5EFB8;
    transform: translateY(-2px);
  }

  .topic-button:disabled {
    opacity: 0.85;
    cursor: not-allowed;
  }

  .topic-name {
    display: block;
    font-size: 14px;
  }

  .topic-desc {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: normal;
    color: #566176;
  }

  .carousel {
    position: relative;
    max-width: 540px;
    margin: 110px auto 0;
    aspect-ratio: 2 / 1;
    border: 2px solid #101D3A;
    border-radius: 14px;
    overflow: hidden;
    background: #101D3A;
    text-align: left;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .slide.active {
    opacity: 1;
  }

  .slide img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .slide-caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 34px 56px 26px 18px;
    background: linear-gradient(to top, rgba(16, 29, 58, 0.85), rgba(16, 29, 58, 0));
    color: #ffffff;
    font-size: 17px;
    font-weight: bold;
    line-height: 1.3;
  }

  .car-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: 2px solid #101D3A;
    border-radius: 50%;
    background: #FFFBD3;
    color: #101D3A;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    z-index: 2;
  }

  .car-btn:hover {
    background: #F5EFB8;
  }

  .car-btn.prev { left: 10px; }
  .car-btn.next { right: 10px; }

  .car-dots {
    position: absolute;
    right: 14px;
    bottom: 12px;
    display: flex;
    gap: 6px;
    z-index: 2;
  }

  .car-dots i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
  }

  .car-dots i.on {
    background: #ffffff;
  }

  .car-btn:focus-visible {
    outline: 3px solid #00aedb;
    outline-offset: 2px;
  }

  #chat-section {
    display: none;
    margin-top: 20px;
    text-align: left;
  }

  .chat-heading {
    text-align: center;
    color: #101D3A;
    font-size: 22px;
  }

  .back-button {
    display: block;
    margin: 0 auto 16px;
    padding: 10px 18px;
    border: 1px solid #101D3A;
    border-radius: 8px;
    background: #FFFBD3;
    color: #101D3A;
    font-size: 14px;
    cursor: pointer;
  }

  .back-button:hover {
    background: #F5EFB8;
  }

  /* Custom chatbot */

  .chat-app {
    --chat-bg: #e8fdff;
    --chat-ink: #11213a;
    --chat-muted: #5b6676;
    --chat-accent: #00aedb;
    --chat-card: #ffffff;

    width: 100%;
    max-width: 960px;
    height: 620px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    background: var(--chat-bg);
    color: var(--chat-ink);
    font-family: "Inter", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    border-radius: 12px;
    overflow: hidden;
  }

  .chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 0 20px;
  }

  .chat-msg {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .chat-msg.chat-user {
    justify-content: flex-end;
  }

  .chat-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
    flex: none;
    display: grid;
    place-items: center;
  }

  .chat-avatar svg {
    width: 30px;
    height: 30px;
  }

  .chat-body {
    flex: 1;
    max-width: 740px;
    min-width: 0;
  }

  .chat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 38px;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
  }

  .chat-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--chat-muted);
    font-size: 12px;
    font-weight: 400;
  }

  .chat-tools button {
    all: unset;
    cursor: pointer;
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    color: var(--chat-muted);
  }

  .chat-tools button:hover,
  .chat-tools button.on {
    color: var(--chat-accent);
  }

  .chat-tools svg {
    width: 15px;
    height: 15px;
  }

  .chat-bubble {
    background: var(--chat-card);
    border-radius: 8px;
    padding: 14px 18px;
    box-shadow: 0 2px 8px rgba(0, 174, 219, 0.12);
    margin-top: 2px;
    overflow-wrap: anywhere;
  }

  .chat-bubble p {
    margin: 0 0 10px;
  }

  .chat-bubble p:last-child {
    margin-bottom: 0;
  }

  .chat-bubble strong {
    font-weight: 600;
  }

  .chat-bubble ul {
    margin: 0 0 10px;
    padding-left: 22px;
  }

  .chat-user-bubble {
    background: var(--chat-accent);
    color: #fff;
    font-weight: 500;
    padding: 12px 18px;
    border-radius: 8px;
    max-width: 80%;
    margin-top: 36px;
    overflow-wrap: anywhere;
  }

  .chat-user.first .chat-user-bubble {
    margin-top: 0;
  }

  .chat-typing {
    display: inline-flex;
    gap: 5px;
    padding: 6px 0;
  }

  .chat-typing i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9aa6b5;
    animation: chat-blink 1.1s infinite ease-in-out;
  }

  .chat-typing i:nth-child(2) {
    animation-delay: .15s;
  }

  .chat-typing i:nth-child(3) {
    animation-delay: .3s;
  }

  @keyframes chat-blink {
    0%, 80%, 100% { opacity: .3; }
    40% { opacity: 1; }
  }

  .chat-composer {
    flex: none;
    padding: 0 0 4px;
  }

  .chat-field {
    display: flex;
    align-items: center;
    background: #fff;
    border: 2px solid var(--chat-accent);
    border-radius: 10px;
    padding: 4px;
  }

  .chat-field input {
    flex: 1;
    min-width: 0;
    border: 1px solid #d5dde5;
    outline: 0;
    background: #fff;
    font: inherit;
    font-size: 16px;
    color: var(--chat-ink);
    padding: 12px;
    border-radius: 6px;
    margin: 4px;
  }

  .chat-field input::placeholder {
    color: #5f6b7a;
  }

  .chat-field button {
    all: unset;
    cursor: pointer;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    margin-right: 6px;
    color: #65758a;
    flex: none;
  }

  .chat-field button:hover,
  .chat-field button:focus-visible {
    color: var(--chat-accent);
  }

  .chat-field button svg {
    width: 24px;
    height: 24px;
  }

  .chat-hint {
    padding: 7px 4px 0;
    color: var(--chat-muted);
    font-size: 12px;
    text-align: center;
  }

  .chat-spacer {
    height: 12px;
  }

  @media (max-width: 480px) {
    body {
      padding: 18px 10px;
    }

    .heading {
      font-size: 27px;
    }

    .topic-grid {
      gap: 8px;
    }

    .topic-button {
      min-height: 58px;
      padding: 8px 12px;
    }

    .topic-desc {
      display: none;
    }

    .chat-app {
      height: 600px;
      padding: 0 10px;
    }

    .chat-bubble {
      padding: 12px;
    }

    .chat-tools {
      gap: 5px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .chat-typing i {
      animation: none;
      opacity: .6;
    }
  }
</style>
</head>

          <button type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.5 3.2 22 12 2.5 20.8l.1-6.9L15 12 2.6 10.1z"/>
            </svg>
          </button>
        </form>
        <div class="chat-spacer"></div>
      </div>
    </div>
  </section>

</main>

<script>

const BOT_NAME = "FNANbot";
const GREETING = "Want to know about put options?";
const FALLBACK = "Sorry, I don't have an answer for that yet. Try asking something about put options.";

const QA = [
  {
    keywords: [
      "What exactly is a put option?",
      "what is a put option",
      "what are put options",
      "define put option"
    ],
    answer: `<p>A contract that gives the buyer the right, but not the obligation, to sell an asset at the strike price by the expiration date</p>`
  },
  {
    keywords: [
      "And how does a put option work?"
    ],
    answer: `<p>Like insurance for a stock you own</p>
             <ul>
               <li>Stock falls: use the put, sell at the higher strike price</li>
               <li>Stock rises: skip the put, sell at market, lose only the fee</li>
             </ul>`
  },
  {
    keywords: [
      "You mentioned strike price before. What is that?",
      "what is the strike price",
      "strike price",
      "define strike price"
    ],
    answer: `<p>The strike price is the agreed price at which the buyer can sell the asset using a put option.</p>`
  },
  {
    keywords: [
      "How about the expiration date?",
      "what is the expiration date",
      "expiration date",
      "when does a put option expire"
    ],
    answer: `<p>Last day the option is valid. After it, the right to sell is gone.</p>`
  },
  {
    keywords: [
      "And who is considered the buyer?"
    ],
    answer: `<p>The buyer is the person who pays the premium to get the right to sell the asset at the strike price.</p>`
  },
  {
    keywords: [
      "Please define what the premium is.",
      "what is the premium",
      "define premium",
      "option premium"
    ],
    answer: `<p>The premium is the price the buyer pays the seller and is paid upfront for the option.</p>`
  },
  {
    keywords: [
      "So who is the seller?"
    ],
    answer: `<p>The seller receives the premium and must buy the asset at the strike price if the buyer exercises.</p>`

  {

      "What does it mean to 'exercise' a put option?",

  {

               <li><strong>At the money:</strong> stock price equals strike</li>

  {

      "what affects the premium",
      "what determines the price of a put option",
      "put option pricing"

    answer: `<ul>
               <li><strong>Stock price:</strong> lower = more valuable</li>
               <li><strong>Strike price:</strong> higher = more valuable</li>
               <li><strong>Time left:</strong> more time = higher price</li>
               <li><strong>Volatility:</strong> bigger swings = higher price</li>
             </ul>`
  },
  {
    keywords: [
      "So I'm guessing that there are benefits to put options, what are they?"
    ],

  },
  {
    keywords: [
      "And why are they important in financial management?"
    ],
    answer: `<p>Put options are primarily used by financial managers and investors for hedging.</p>`
  },
  {
    keywords: [

  },
   {
    keywords: [
      "I see. So is there a specific way to use put options for hedging?",

  {
    keywords: [
      "Can someone use puts without owning the stock, just to make money?",

  {
    keywords: [

  {
    keywords: [
      "And what risks does the seller face?"
    ],

      "break even price",

             <p>Stock must fall below breakeven for the buyer to profit</p>

  {
    keywords: [
      "So if I wanted to buy put options, what can I do to mitigate the risks?"

    answer: `<p>Only risk money you can afford to lose.</p>`
  },
  {
    keywords: [
      "And as a seller? How do I manage the risks?"

  {
    keywords: [

    keywords: [

      "seller example",

    answer: `<ul>

  {
    keywords: [

      "trade options in belize"
    ],
    answer: `<p>Not directly through a local market, for now.</p>`
  },
   {
    keywords: [

    answer: `<p>Sure! A put option gives the buyer the right, but not the obligation, to sell an asset at the strike price by the expiration date. The buyer pays a premium for that right, while the seller collects the premium and must buy the asset if the buyer exercises. Put options protect against falling prices and can also be used to profit from them, and the buyer can only lose the premium, while the seller can face much bigger losses.</p>`
  }
];

  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
</svg>`;

function timeNow() {
  const d = new Date();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, "0");
  const ap = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return `${h}:${m}${ap}`;
}

function scrollChat() {
  $messages.scrollTop = $messages.scrollHeight;
}

function addBot(html, withTools = true) {
  const el = document.createElement("div");
  el.className = "chat-msg chat-bot";

  el.innerHTML = `
    <div class="chat-avatar">${ROBOT}</div>
    <div class="chat-body">
      <div class="chat-head">
        <span>${BOT_NAME}</span>
        ${withTools ? `
          <span class="chat-tools">
            <button type="button" data-act="up" aria-label="Good answer">${ICON_UP}</button>
            <button type="button" data-act="down" aria-label="Bad answer">${ICON_DOWN}</button>
            <button type="button" data-act="copy" aria-label="Copy answer">${ICON_COPY}</button>
            <span>${timeNow()}</span>
          </span>
        ` : ""}
      </div>
      <div class="chat-bubble">${html}</div>
    </div>
  `;

  $messages.appendChild(el);
  scrollChat();
  return el;
}

function addUser(text) {
  const el = document.createElement("div");
  el.className = "chat-msg chat-user";

  if (!$messages.querySelector(".chat-user")) {
    el.classList.add("first");
  }

  const bubble = document.createElement("div");
  bubble.className = "chat-user-bubble";
  bubble.textContent = "";

  el.appendChild(bubble);
  $messages.appendChild(el);
  scrollChat();

  return bubble;
}

function typeQuestion(bubble, text, speed = 25) {
  return new Promise((resolve) => {
    let position = 0;

    const typingInterval = setInterval(() => {
      bubble.textContent += text.charAt(position);
      position++;
      scrollChat();

      if (position >= text.length) {
        clearInterval(typingInterval);
        resolve();
      }
    }, speed);
  });
}

function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function findAnswer(text) {
  const question = " " + normalize(text) + " ";
  let bestAnswer = null;
  let bestLength = 0;

  for (const item of QA) {
    for (const keyword of item.keywords) {
      const normalizedKeyword = " " + normalize(keyword) + " ";

      if (
        question.includes(normalizedKeyword) &&
        normalizedKeyword.length > bestLength
      ) {
        bestAnswer = item;
        bestLength = normalizedKeyword.length;
      }
    }
  }

  return bestAnswer
    ? bestAnswer.answer
    : `<p>${FALLBACK}</p>`;
}

let pendingAnswer = null;

function revealAnswer(html) {
  isReplyPending = true;

  const typing = addBot(
    `<span class="chat-typing"><i></i><i></i><i></i></span>`,
    false
  );

  setTimeout(() => {
    typing.remove();
    addBot(html);
    isReplyPending = false;
  }, 1000);
}

function flushPendingAnswer() {
  if (pendingAnswer === null) return;
  addBot(pendingAnswer);
  pendingAnswer = null;
}

async function ask(text) {
  if (isReplyPending) return;
  isReplyPending = true;

  flushPendingAnswer();

  const questionBubble = addUser(text);
  await typeQuestion(questionBubble, text);
  revealAnswer(findAnswer(text));
}

async function askPrepared(text) {
  if (isReplyPending) return;
  isReplyPending = true;

  const questionBubble = addUser(text);
  await typeQuestion(questionBubble, text);

  pendingAnswer = findAnswer(text);
  isReplyPending = false;
}

function showNextQuestion() {
  if (isReplyPending) return;

  if (pendingAnswer !== null) {
    const answer = pendingAnswer;
    pendingAnswer = null;
    revealAnswer(answer);
    return;
  }

  if (nextQuestionIndex >= QA.length) return;

  const question = QA[nextQuestionIndex].keywords[0];
  nextQuestionIndex++;
  askPrepared(question);
}

document.addEventListener("keydown", (event) => {
  if (event.key !== "ArrowRight") return;

  const chatIsVisible =
    document.getElementById("chat-section").style.display !== "none";

  if (!chatIsVisible || event.altKey || event.ctrlKey || event.metaKey) return;

  const typingInInput =
    event.target === $input && $input.value.length > 0;

  if (typingInInput) return;

  event.preventDefault();
  showNextQuestion();
});

$form.addEventListener("submit", (event) => {
  event.preventDefault();

  const text = $input.value.trim();
  if (!text) return;

  $input.value = "";
  ask(text);
});

$messages.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-act]");
  if (!button) return;

  const action = button.dataset.act;

  if (action === "copy") {
    const answer = button
      .closest(".chat-body")
      .querySelector(".chat-bubble").innerText;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(answer).catch(() => {});
    }

    button.classList.add("on");
    setTimeout(() => button.classList.remove("on"), 1200);
  } else {
    const tools = button.closest(".chat-tools");

    tools.querySelectorAll('[data-act="up"], [data-act="down"]')
      .forEach((item) => item.classList.remove("on"));

    button.classList.add("on");
  }
});

function showChatbot() {
  document.getElementById("menu-section").style.display = "none";
  document.getElementById("chat-section").style.display = "block";

  document.getElementById("chat-section").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  $input.focus();
}

function hideChatbot() {
  document.getElementById("chat-section").style.display = "none";
  document.getElementById("menu-section").style.display = "block";

  document.getElementById("menu-section").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

addBot(`<p>${GREETING}</p>`, false);

const CAROUSEL_SECONDS = 4;
const SLIDES = [
  { image: "explained.png", caption: "Protect your investments when prices fall",  color: "linear-gradient(135deg,#101D3A,#2a4a7f)" },
  { image: "putseller.png", caption: "P&L Potential for Put Option Seller",   color: "linear-gradient(135deg,#0a8f8f,#0b3d5c)" },
  { image: "putbuyer.png", caption: "P&L Potential for Put Option Buyer", color: "linear-gradient(135deg,#e4572e,#7a1f3d)" },
  { image: "riskreward.png", caption: "Risks and Rewards",   color: "linear-gradient(135deg,#00aedb,#101D3A)" }
];

(function () {
  const box = document.getElementById("slides");
  const dotsBox = document.getElementById("car-dots");
  const slideEls = [];
  const dotEls = [];
  let current = 0;
  let timer = null;

  SLIDES.forEach((slide) => {
    const el = document.createElement("div");
    el.className = "slide";
    el.style.background = slide.color;

    if (slide.image) {
      const img = document.createElement("img");
      img.src = slide.image;
      img.alt = slide.caption;
      img.onerror = () => img.remove();
      el.appendChild(img);
    }

    const cap = document.createElement("div");
    cap.className = "slide-caption";
    cap.textContent = slide.caption;
    el.appendChild(cap);

    box.appendChild(el);
    slideEls.push(el);

    const dot = document.createElement("i");
    dotsBox.appendChild(dot);
    dotEls.push(dot);
  });

  function show(index) {
    current = (index + slideEls.length) % slideEls.length;
    slideEls.forEach((el, n) => el.classList.toggle("active", n === current));
    dotEls.forEach((d, n) => d.classList.toggle("on", n === current));
  }

  function stop() { clearInterval(timer); timer = null; }

  function start() {
    stop();
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    timer = setInterval(() => show(current + 1), CAROUSEL_SECONDS * 1000);
  }

  document.getElementById("car-prev").onclick = () => { show(current - 1); start(); };
  document.getElementById("car-next").onclick = () => { show(current + 1); start(); };

  const carousel = document.getElementById("carousel");
  carousel.addEventListener("mouseenter", stop);
  carousel.addEventListener("mouseleave", start);

  show(0);
  start();
})();
</script>
</body>
