<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Featured Articles</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#101D3A;--sky:#d9f1fe;--butter:#FFFBD3;--cyan:#00aedb;--mute:#566176}
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:Comfortaa,Arial,sans-serif;color:var(--navy);background:var(--sky);line-height:1.5}
.panel{background:#fff;border:2px solid var(--navy);border-radius:14px;padding:16px;max-width:420px;margin:0 auto}
h2{font-size:18px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px dashed var(--sky)}
.item{display:block;padding:12px 0;border-bottom:1px solid #e8eef4;cursor:pointer;color:inherit;text-decoration:none}
.item:last-child{border-bottom:0;padding-bottom:0}
.cover{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;display:grid;place-items:center;margin-bottom:8px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover svg{width:44px;height:44px}
h3{font-size:15px;line-height:1.35;margin:0 0 4px}
.item:hover h3{color:var(--cyan)}
small{color:var(--mute);font-size:12px}
.tag{display:inline-block;background:var(--butter);border:1px solid var(--navy);border-radius:20px;padding:0 9px;font-size:11px;margin-right:6px}
.item:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px}
</style>
</head>
<body>

<div class="panel" aria-label="Featured articles">
  <h2>Featured articles</h2>
  <div id="list"></div>
</div>

<script>

const ARTICLES = [
  { title: "New Derivative Discovered!",
    tag: "Breaking", meta: "Just now", image: "guy.jpg",
    color: "#d9f1fe", stroke: "#101D3A",
    icon: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.600 5.600l2.100 2.100M16.300 16.300l2.100 2.100M5.600 18.400l2.100-2.100M16.300 7.700l2.100-2.100"/><circle cx="12" cy="12" r="3"/>' },
  { title: "Belize to introduce more Derivatives until 2099!",
    tag: "Belize", meta: "Yesterday", image: "2099.jpg",
    color: "#e4f7f1", stroke: "#0a8f8f",
    icon: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>' },
  { title: "FNAN4360 is the Best Course to take!",
    tag: "Campus", meta: "2 days ago", image: "class.jpg",
    color: "#FFFBD3", stroke: "#101D3A",
    icon: '<path d="M2 9l10-5 10 5-10 5zM6 11.500V16c0 1.500 3 3 6 3s6-1.500 6-3v-4.500"/>' },
  { title: "Why Put Options are for you!",
    tag: "Put Options", meta: "3 days ago", image: "Whyputs.jpg",
    color: "#fdeee9", stroke: "#e4572e",
    icon: '<path d="M12 2l8 4v6c0 5-3.500 8-8 10-4.500-2-8-5-8-10V6z"/>' }
];

const list = document.getElementById("list");
ARTICLES.forEach((a) => {
  const el = document.createElement("a");
  el.className = "item";
  el.tabIndex = 0;
  el.setAttribute("role", "article");

  const cover = document.createElement("div");
  cover.className = "cover";
  cover.style.background = a.color;
  if (a.image) {
    const img = document.createElement("img");
    img.src = a.image;
    img.alt = a.title;
    img.onerror = () => { img.remove(); cover.innerHTML = placeholder(a); };
    cover.appendChild(img);
  } else {
    cover.innerHTML = placeholder(a);
  }

  const text = document.createElement("div");
  const h = document.createElement("h3");
  h.textContent = a.title;
  const s = document.createElement("small");
  s.innerHTML = '<span class="tag"></span>';
  s.querySelector(".tag").textContent = a.tag;
  s.append(a.meta);
  text.append(h, s);

  el.append(cover, text);
  list.appendChild(el);
});

function placeholder(a) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="' + a.stroke + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + a.icon + '</svg>';
}
</script>
</body>
</html>
