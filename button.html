
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

body {
  margin: 0;
  padding: 4px;
  font-family: Arial, sans-serif;
  background: transparent;
}

.learning-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  box-sizing: border-box;
  padding: 16px 20px;
  background: linear-gradient(135deg, #4776e6, #3155c6);
  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 20px;
  font-weight: 700;
  text-decoration: none;
  border-radius: 14px;
  border: none;
  box-shadow: 0 6px 14px rgba(49, 85, 198, 0.25);
}
    .learning-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 18px rgba(49, 85, 198, 0.35);
    }

    .arrow {
      font-size: 24px;
      transition: transform 0.2s ease;
    }

    .learning-button:hover .arrow {
      transform: translateX(4px);
    }
  </style>
</head>

<body>
  <a
    class="learning-button"
    href="https://sites.google.com/view/chatbot-assignment-2/beginner/home"
    target="_blank"
    rel="noopener noreferrer"
  >
    Start Learning <span class="arrow">→</span>
  </a>
</body>
</html>
