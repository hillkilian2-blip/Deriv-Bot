<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swappy Learning Menu</title>
<style>
  :root {
    --blue: #2478df;
    --blue-dark: #155bb3;
    --blue-pale: #eaf3ff;
    --ink: #1d2b3a;
    --muted: #66788a;
    --line: #dce5ef;
    --surface: #ffffff;
    --soft: #f5f8fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 8px;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
    background: transparent;
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  .start-button {
    display: block;
    margin: 0 auto;
    padding: 15px 30px;
    border: 0;
    border-radius: 14px;
    color: #fff;
    background: linear-gradient(135deg, #2788f5, #155bbd);
    box-shadow: 0 7px 18px rgba(28, 103, 201, .24);
    font-weight: 700;
    font-size: 17px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .start-button:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(28, 103, 201, .3); }
  .topic-menu { display: none; max-width: 560px; margin: 4px auto 0; }
  .menu-heading { margin: 0 0 14px; text-align: center; font-size: 20px; }
  .menu-subtitle { margin: -7px 0 18px; text-align: center; color: var(--muted); font-size: 13px; }
  .topic-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .topic-button {
    min-height: 54px;
    padding: 12px 10px;
    border: 1px solid #d8e7fa;
    border-radius: 12px;
    background: #f4f8ff;
    color: #174e91;
    font-weight: 700;
    transition: background .15s ease, transform .15s ease;
  }
  .topic-button:hover { background: #e4efff; transform: translateY(-1px); }
  .chat-wrap { display: none; width: 100%; max-width: 620px; margin: 0 auto; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 26px rgba(32, 64, 102, .10); }
  .chat-header { display: flex; align-items: center; gap: 11px; padding: 14px 16px; color: #fff; background: linear-gradient(120deg, #2478df, #1658ad); }
  .avatar { display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); font-size: 21px; }
  .bot-name { margin: 0; font-size: 17px; font-weight: 700; }
  .bot-status { margin-top: 3px; font-size: 12px; opacity: .88; }
  .back-button { margin-left: auto; padding: 8px 10px; border: 1px solid rgba(255,255,255,.45); border-radius: 9px; background: rgba(255,255,255,.12); color: white; font-size: 12px; font-weight: 700; }
  .chat-body { padding: 16px 14px 12px; background: #f8fbff; }
  .messages { display: flex; flex-direction: column; gap: 13px; min-height: 170px; max-height: 340px; overflow-y: auto; padding: 2px 2px 12px; }
  .message-row { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; max-width: 92%; animation: appear .2s ease-out; }
  .message-row.user { align-self: flex-end; align-items: flex-end; }
  .bubble { padding: 11px 13px; border-radius: 15px 15px 15px 5px; background: #fff; border: 1px solid #e1eaf4; color: #26394d; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  .message-row.user .bubble { border: 0; border-radius: 15px 15px 5px 15px; background: var(--blue); color: #fff; }
  .message-time { color: #8291a1; font-size: 10px; padding: 0 3px; }
  .typing-bubble { display: inline-flex; align-items: center; gap: 4px; min-width: 53px; }
  .typing-bubble span { width: 6px; height: 6px; border-radius: 50%; background: #8197ad; animation: bounce 1s infinite ease-in-out; }
  .typing-bubble span:nth-child(2) { animation-delay: .15s; }
  .typing-bubble span:nth-child(3) { animation-delay: .3s; }
  .suggestion-label { margin: 2px 0 8px; color: #60758b; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 13px; }
  .suggestion { padding: 8px 10px; border: 1px solid #bdd8fb; border-radius: 999px; background: #fff; color: #1c62b6; font-size: 12px; text-align: left; transition: background .15s ease; }
  .suggestion:hover { background: #e8f2ff; }
  .chat-form { display: flex; align-items: center; gap: 8px; padding: 10px; border: 1px solid #d9e4ef; border-radius: 14px; background: #fff; }
  .chat-input { flex: 1; width: 0; min-width: 0; padding: 7px 5px; border: 0; outline: none; color: var(--ink); background: transparent; font-size: 14px; }
  .chat-input::placeholder { color: #92a0af; }
  .send-button { display: grid; place-items: center; flex: 0 0 38px; width: 38px; height: 38px; border: 0; border-radius: 11px; background: var(--blue); color: white; font-size: 19px; font-weight: 700; }
  .send-button:hover { background: var(--blue-dark); }
  .hint { margin: 9px 3px 0; color: #7d8d9d; font-size: 11px; line-height: 1.4; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 340px) {
    .topic-grid { grid-template-columns: 1fr; }
    .chat-header { padding: 12px 10px; }
    .back-button { padding: 7px; }
    .chat-body { padding: 12px 9px 10px; }
    .suggestion { font-size: 11px; }
  }
</style>
</head>
<body>
  <button class="start-button" id="startButton" type="button" onclick="showMenu()">Start Learning <span aria-hidden="true">→</span></button>

  <section class="topic-menu" id="topicMenu" aria-label="Learning topics">
    <h2 class="menu-heading">Choose a Topic</h2>
    <p class="menu-subtitle">Select a topic to begin learning.</p>
    <div class="topic-grid">
      <button class="topic-button" type="button" onclick="showTopic('Futures')">Futures</button>
      <button class="topic-button" type="button" onclick="showTopic('Currency Swaps')">Currency Swaps</button>
      <button class="topic-button" type="button" onclick="showTopic('Call Option')">Call Option</button>
      <button class="topic-button" type="button" onclick="showTopic('Interest Rate Swap')">Interest Rate Swap</button>
      <button class="topic-button" type="button" onclick="showTopic('Forwards')">Forwards</button>
      <button class="topic-button" type="button" onclick="showTopic('Put Options')">Put Options</button>
    </div>
  </section>

  <section class="chat-wrap" id="putOptionsChat" aria-label="Swappy Put Options chatbot">
    <header class="chat-header">
      <div class="avatar" aria-hidden="true">S</div>
      <div>
        <h2 class="bot-name">Swappy</h2>
        <div class="bot-status">Put Options Learning Assistant · Online</div>
      </div>
      <button class="back-button" type="button" onclick="backToMenu()">← Topics</button>
    </header>
    <main class="chat-body">
      <div class="messages" id="messages" aria-live="polite"></div>
      <p class="suggestion-label">Suggested questions</p>
      <div class="suggestions" id="suggestions">
        <button class="suggestion" type="button" data-question="What is a put option?">What is a put option?</button>
        <button class="suggestion" type="button" data-question="How does a put option work?">How does it work?</button>
        <button class="suggestion" type="button" data-question="Who buys and sells put options?">Who buys and sells them?</button>
        <button class="suggestion" type="button" data-question="Give me a numerical example of a put option.">Show me an example</button>
        <button class="suggestion" type="button" data-question="What are the benefits and risks of put options?">Benefits and risks</button>
        <button class="suggestion" type="button" data-question="What is the difference between a call option and a put option?">Put vs. call options</button>
      </div>
      <form class="chat-form" id="chatForm">
        <input class="chat-input" id="chatInput" type="text" placeholder="Type a question..." autocomplete="off" aria-label="Type a question">
        <button class="send-button" type="submit" aria-label="Send message">➤</button>
      </form>
      <p class="hint">Tip: try a suggested question or type a question about put options.</p>
    </main>
  </section>

<script>
  const answers = [
    {
      keys: ['what is a put option', 'define put option', 'definition', 'meaning of a put'],
      answer: 'A put option is a financial contract that gives the buyer the right, but not the obligation, to sell an asset at a set price, called the strike price, on or before a specified date. It is often used to protect against a possible fall in an asset’s price.'
    },
    {
      keys: ['how does a put option work', 'how it works', 'work', 'strike price', 'expiration'],
      answer: 'The buyer pays a premium for the option. If the asset’s market price falls below the strike price, the buyer may be able to sell at the higher strike price, making the option valuable. If the option is not useful by expiration, the buyer can let it expire and generally loses the premium paid.'
    },
    {
      keys: ['who buys and sells', 'buyer and seller', 'who buys', 'who sells', 'writer'],
      answer: 'The buyer purchases the right to sell the asset and pays the premium. The seller, also called the writer, receives the premium and takes on the obligation to buy the asset at the strike price if the option is exercised, according to the contract terms.'
    },
    {
      keys: ['example', 'numerical', 'numbers', 'calculate'],
      answer: 'Example: imagine you own a share worth $50 and buy a put option with a $45 strike price for a $2 premium per share. If the share price falls to $35, the option has $10 of intrinsic value per share. After subtracting the $2 premium, the buyer’s net result is $8 per share, ignoring fees. If the share stays above $45 at expiration, the option may expire worthless and the buyer loses the $2 premium.'
    },
    {
      keys: ['benefit', 'benefits', 'risk', 'risks', 'advantage', 'disadvantage'],
      answer: 'A key benefit for a buyer is protection against a price drop, and a put can also be used to speculate on falling prices. The buyer’s loss is generally limited to the premium paid. Risks include losing the entire premium if the option expires unused. A put seller receives the premium but can face substantial losses if the asset price falls.'
    },
    {
      keys: ['difference between a call', 'put vs call', 'call option', 'call and put', 'compare call'],
      answer: 'A call option gives its buyer the right to buy an asset at the strike price. A put option gives its buyer the right to sell an asset at the strike price. Buyers often use calls when they expect prices to rise and puts when they expect prices to fall or want protection against a decline.'
    },
    {
      keys: ['in the money', 'at the money', 'out of the money', 'moneyness'],
      answer: 'A put option is in the money when the market price is below the strike price, at the money when the two prices are equal, and out of the money when the market price is above the strike price. The premium and time remaining also affect the option’s overall value.'
    },
    {
      keys: ['premium', 'cost', 'price of option'],
      answer: 'The premium is the price the buyer pays to purchase the option. It is generally affected by factors such as the asset price, strike price, time until expiration, expected volatility, and interest rates. The buyer generally loses the premium if the put expires without value.'
    }
  ];

  let firstVisit = true;

  function showMenu() {
    document.getElementById('startButton').style.display = 'none';
    document.getElementById('topicMenu').style.display = 'block';
    document.getElementById('putOptionsChat').style.display = 'none';
  }

  function showTopic(topic) {
    if (topic !== 'Put Options') return;
    document.getElementById('topicMenu').style.display = 'none';
    document.getElementById('putOptionsChat').style.display = 'block';
    if (firstVisit) {
      addMessage('bot', 'Hi! I’m Swappy. I can help you learn about put options. Choose one of the suggested questions below, or type a question in the message box.');
      firstVisit = false;
    }
    document.getElementById('chatInput').focus();
  }

  function backToMenu() {
    document.getElementById('putOptionsChat').style.display = 'none';
    document.getElementById('topicMenu').style.display = 'block';
  }

  function addMessage(sender, text) {
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'message-row' + (sender === 'user' ? ' user' : '');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    const time = document.createElement('div');
    time.className = 'message-time';
    time.textContent = sender === 'user' ? 'You' : 'Swappy';
    row.appendChild(bubble);
    row.appendChild(time);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function addTyping() {
    const messages = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'message-row';
    row.id = 'typingIndicator';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing-bubble';
    bubble.setAttribute('aria-label', 'Swappy is typing');
    for (let i = 0; i < 3; i++) bubble.appendChild(document.createElement('span'));
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function getAnswer(question) {
    const cleaned = question.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
    for (const item of answers) {
      if (item.keys.some(key => cleaned.includes(key))) return item.answer;
    }
    if (cleaned.includes('hello') || cleaned.includes('hi swappy') || cleaned === 'hi') {
      return 'Hello! Let’s learn about put options. You can ask me for a definition, an example, how they work, or their benefits and risks.';
    }
    return 'I’m still learning how to respond to that question. Try asking what a put option is, how it works, who buys or sells it, for a numerical example, or about its benefits and risks.';
  }

  function sendQuestion(question) {
    const value = question.trim();
    if (!value) return;
    addMessage('user', value);
    const typing = addTyping();
    window.setTimeout(() => {
      typing.remove();
      addMessage('bot', getAnswer(value));
    }, 650);
  }

  document.getElementById('chatForm').addEventListener('submit', function(event) {
    event.preventDefault();
    const input = document.getElementById('chatInput');
    sendQuestion(input.value);
    input.value = '';
    input.focus();
  });

  document.getElementById('suggestions').addEventListener('click', function(event) {
    const button = event.target.closest('button[data-question]');
    if (button) sendQuestion(button.dataset.question);
  });
</script>
</body>
</html>
